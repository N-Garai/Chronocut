<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="36" fill="none" stroke="#FFC300" stroke-width="5" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="rgba(255,195,0,0.25)" stroke-width="1.5"/>
  <polygon points="44,38 44,62 64,50" fill="#FFC300" filter="url(#glow)"/>
</svg>
